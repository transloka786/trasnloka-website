name: Search indexing regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium
      - name: Validate server HTML, canonical URLs and discovery
        run: |
          npm run start > /tmp/seo-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 2; done
          node scripts/seo-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-review
          path: seo-artifacts/
          if-no-files-found: warn
