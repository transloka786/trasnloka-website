name: Website production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Privacy and database tests
        run: npm run test:privacy
      - name: Build production website
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-log
          path: build.log
          if-no-files-found: warn
      - name: Install browser for privacy checks
        run: npx playwright install --with-deps chromium
      - name: Check consent and restricted reporting in the browser
        run: |
          npm run start > /tmp/kritrna-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          npm run test:privacy:browser
      - name: Upload privacy screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-browser-checks
          path: privacy-artifacts/
          if-no-files-found: ignore
