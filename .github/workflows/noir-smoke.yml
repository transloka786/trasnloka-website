name: Noir browser checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and responsive checks
        run: |
          npm run start > /tmp/noir-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 2; done
          npm run test:visual
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noir-browser-review
          path: noir-artifacts/
          if-no-files-found: warn
