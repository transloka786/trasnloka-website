name: Mobile hero and soundtrack regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright install --with-deps chromium webkit
      - name: Start an audio output for Linux WebKit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_output
          pactl set-default-sink ci_output
          pactl info
      - name: WebKit and Chromium regression
        run: |
          npm run start > /tmp/mobile-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:3000 >/dev/null && break || sleep 2; done
          node scripts/mobile-hotfix-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-hero-hotfix-review
          path: hotfix-artifacts/
          if-no-files-found: warn
